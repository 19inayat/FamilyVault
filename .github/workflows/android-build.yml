name: Sprint 1 - FamilyVault Industrial Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Rescue .kt Files from Spaced Folders & Normalize Paths
        run: |
          python3 - << 'EOF'
          import os, shutil

          # Map every expected Kotlin file to its exact clean destination path
          target_files = {
              "MainActivity.kt": "app/src/main/java/com/familyvault/app/MainActivity.kt",
              "VaultCryptoManager.kt": "app/src/main/java/com/familyvault/app/crypto/VaultCryptoManager.kt",
              "Entities.kt": "app/src/main/java/com/familyvault/app/data/local/Entities.kt",
              "VaultDao.kt": "app/src/main/java/com/familyvault/app/data/local/VaultDao.kt",
              "VaultDatabase.kt": "app/src/main/java/com/familyvault/app/data/local/VaultDatabase.kt",
              "AndroidManifest.xml": "app/src/main/AndroidManifest.xml",
              "build.gradle.kts": "app/build.gradle.kts"
          }

          rescued_contents = {}

          # Search entire repo (even inside folders with hidden spaces)
          for root, dirs, files in os.walk("."):
              if ".git" in root.split(os.sep):
                  continue
              for f in files:
                  clean_f = f.strip()
                  full_path = os.path.join(root, f)
                  # Avoid picking root build.gradle.kts as app/build.gradle.kts
                  if clean_f == "build.gradle.kts" and os.path.normpath(root) == ".":
                      continue
                  if clean_f in target_files:
                      with open(full_path, "rb") as fp:
                          data = fp.read()
                      if len(data) > 50:
                          rescued_contents[clean_f] = data
                          print(f"Found '{clean_f}' at '{full_path}' ({len(data)} bytes)")

          # Remove any duplicate/spaced 'app' directories
          for item in os.listdir("."):
              if item.strip().startswith("app") and os.path.isdir(item):
                  shutil.rmtree(item)

          # Recreate clean directory structure and write rescued files
          os.makedirs("app/src/main/java/com/familyvault/app/crypto", exist_ok=True)
          os.makedirs("app/src/main/java/com/familyvault/app/data/local", exist_ok=True)

          for fname, dest_path in target_files.items():
              if fname in rescued_contents:
                  with open(dest_path, "wb") as out:
                      out.write(rescued_contents[fname])
                  print(f"Restored clean file -> {dest_path}")
              else:
                  print(f"⚠️ Warning: {fname} was not found in repository!")
          EOF

      - name: 3. Verify All 5 Kotlin Source Files Exist & Zero Internet Permission
        run: |
          for kt_file in \
            "app/src/main/java/com/familyvault/app/MainActivity.kt" \
            "app/src/main/java/com/familyvault/app/crypto/VaultCryptoManager.kt" \
            "app/src/main/java/com/familyvault/app/data/local/Entities.kt" \
            "app/src/main/java/com/familyvault/app/data/local/VaultDao.kt" \
            "app/src/main/java/com/familyvault/app/data/local/VaultDatabase.kt"; do
            if [ ! -f "$kt_file" ]; then
              echo "❌ MISSING SOURCE FILE: $kt_file"
              exit 1
            fi
          done
          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "❌ SECURITY VIOLATION: INTERNET permission found!"
            exit 1
          fi
          echo "✅ All 5 Kotlin files and Zero-Network Manifest verified."

      - name: 4. Enforce Root Gradle Configuration
        run: |
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FamilyVault"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("com.google.devtools.ksp") version "2.0.21-1.0.27" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

      - name: 5. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 6. Accept Pre-Installed Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: 7. Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 8. Compile Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 9. Audit APK Bytecode (Verify MainActivity.class is Compiled)
        run: |
          if ! find app/build -name "MainActivity.class" | grep -q "MainActivity.class"; then
            echo "❌ FATAL: MainActivity.class was NOT compiled! Aborting."
            exit 1
          fi
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "classes.dex"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "libsqlcipher.so"
          echo "✅ APK Bytecode Audit Passed: MainActivity.class and libsqlcipher.so verified!"

      - name: 10. Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyVault-RealmeAndroid13-Verified
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
