name: Sprint 3.2 - Tagless Name & Multi-Tag Precision OCR Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Cache Persistent Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: familyvault-persistent-debug-keystore-v1

      - name: 3. Generate Complete Sprint 3.2 Source Tree (All 8 Kotlin Files)
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/familyvault/app/crypto
          mkdir -p app/src/main/java/com/familyvault/app/data/local
          mkdir -p app/src/main/java/com/familyvault/app/domain
          mkdir -p app/src/main/java/com/familyvault/app/scanner

