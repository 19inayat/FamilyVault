name: Sprint 3 - FamilyVault Scanner, QR & Voice Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Cache Persistent Debug Keystore (Prevents Uninstall on Update)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: familyvault-persistent-debug-keystore-v1

      - name: 3. Rescue Files & Verify Balanced Syntax
        run: |
          python3 - << 'EOF'
          import os, shutil

          target_files = {
              "MainActivity.kt": "app/src/main/java/com/familyvault/app/MainActivity.kt",
              "VaultCryptoManager.kt": "app/src/main/java/com/familyvault/app/crypto/VaultCryptoManager.kt",
              "Entities.kt": "app/src/main/java/com/familyvault/app/data/local/Entities.kt",
              "VaultDao.kt": "app/src/main/java/com/familyvault/app/data/local/VaultDao.kt",
              "VaultDatabase.kt": "app/src/main/java/com/familyvault/app/data/local/VaultDatabase.kt",
              "NameResolutionEngine.kt": "app/src/main/java/com/familyvault/app/domain/NameResolutionEngine.kt",
              "DocumentParserEngine.kt": "app/src/main/java/com/familyvault/app/domain/DocumentParserEngine.kt",
              "ScanAndVoiceProcessor.kt": "app/src/main/java/com/familyvault/app/scanner/ScanAndVoiceProcessor.kt"
          }

          rescued = {}
          for root, dirs, files in os.walk("."):
              if ".git" in root.split(os.sep):
                  continue
              for f in files:
                  clean_f = f.strip()
                  if clean_f in target_files:
                      full_path = os.path.join(root, f)
                      with open(full_path, "rb") as fp:
                          data = fp.read()
                      if len(data) > 50:
                          rescued[clean_f] = data

          for item in os.listdir("."):
              if item.strip().startswith("app") and os.path.isdir(item):
                  shutil.rmtree(item)

          os.makedirs("app/src/main/java/com/familyvault/app/crypto", exist_ok=True)
          os.makedirs("app/src/main/java/com/familyvault/app/data/local", exist_ok=True)
          os.makedirs("app/src/main/java/com/familyvault/app/domain", exist_ok=True)
          os.makedirs("app/src/main/java/com/familyvault/app/scanner", exist_ok=True)

          for fname, dest in target_files.items():
              if fname in rescued:
                  text = rescued[fname].decode("utf-8", errors="ignore")
                  if text.count("{") == text.count("}") and text.count("(") == text.count(")"):
                      with open(dest, "w", encoding="utf-8") as out:
                          out.write(text)
                      print(f"Verified balanced syntax -> {dest}")
                  else:
                      print(f"❌ Syntax mismatch in {fname}!")
                      exit(1)
          EOF

      - name: 4. Enforce Sprint 3 Manifest & Gradle Config (With ML Kit)
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/ic_lock_lock"
                  android:label="FamilyVault"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }
          android {
              namespace = "com.familyvault.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.familyvault.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 7
                  versionName = "0.3.0-sprint3"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              packaging {
                  resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" }
                  jniLibs { useLegacyPackaging = true }
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.fragment:fragment-ktx:1.8.2")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.4")
              implementation("androidx.biometric:biometric:1.1.0")

              val roomVersion = "2.6.1"
              implementation("androidx.room:room-runtime:$roomVersion")
              implementation("androidx.room:room-ktx:$roomVersion")
              ksp("androidx.room:room-compiler:$roomVersion")
              implementation("net.zetetic:sqlcipher-android:4.6.1@aar")
              implementation("androidx.sqlite:sqlite-ktx:2.4.0")

              // Sprint 3: On-Device ML Kit Document Scanner, Text OCR v2 & QR Barcode
              implementation("com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1")
              implementation("com.google.mlkit:text-recognition:16.0.1")
              implementation("com.google.mlkit:barcode-scanning:17.3.0")

              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")

              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
          }
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FamilyVault"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("com.google.devtools.ksp") version "2.0.21-1.0.27" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

      - name: 5. Security Gate - Verify Zero Internet Permission
        run: |
          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "❌ SECURITY VIOLATION: INTERNET permission found!"
            exit 1
          fi

      - name: 6. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 7. Ensure Persistent Debug Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 8. Accept Pre-Installed Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: 9. Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 10. Compile Debug APK
        run: gradle assembleDebug --no-daemon --console=plain

      - name: 11. Audit APK Bytecode
        run: |
          for cls in "MainActivity.class" "NameResolutionEngine.class" "DocumentParserEngine.class" "ScanAndVoiceProcessor.class"; do
            if ! find app/build -name "$cls" | grep -q "$cls"; then
              echo "❌ FATAL: $cls was NOT compiled!"
              exit 1
            fi
          done
          echo "✅ Sprint 3 Bytecode Audit Passed!"

      - name: 12. Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyVault-Sprint3-v0.3.0-ScannerAndVoice
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
