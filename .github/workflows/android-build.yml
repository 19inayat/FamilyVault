name: Sprint 1 - FamilyVault Industrial Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Security Gate - Verify Zero Internet Permission
        run: |
          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "❌ SECURITY VIOLATION: INTERNET permission found in AndroidManifest.xml!"
            exit 1
          else
            echo "✅ Zero-Network Manifest Verified."
          fi

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Setup Gradle 8.10.2 & Execute Build
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          arguments: assembleDebug --stacktrace

      - name: 6. Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyVault-Sprint1-v0.1-alpha
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
