name: Sprint 3.1 - High-Precision Spatial OCR & QR Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Cache Persistent Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: familyvault-persistent-debug-keystore-v1

      - name: 3. Verify Source Tree & Enforce Build Configuration
        run: |
          mkdir -p app/src/main/java/com/familyvault/app/crypto
          mkdir -p app/src/main/java/com/familyvault/app/data/local
          mkdir -p app/src/main/java/com/familyvault/app/domain
          mkdir -p app/src/main/java/com/familyvault/app/scanner

          sed 's/^          //' << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }
          android {
              namespace = "com.familyvault.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.familyvault.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 8
                  versionName = "0.3.1-precision-ocr"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              packaging {
                  resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" }
                  jniLibs { useLegacyPackaging = true }
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.fragment:fragment-ktx:1.8.2")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.4")
              implementation("androidx.biometric:biometric:1.1.0")

              val roomVersion = "2.6.1"
              implementation("androidx.room:room-runtime:$roomVersion")
              implementation("androidx.room:room-ktx:$roomVersion")
              ksp("androidx.room:room-compiler:$roomVersion")
              implementation("net.zetetic:sqlcipher-android:4.6.1@aar")
              implementation("androidx.sqlite:sqlite-ktx:2.4.0")

              implementation("com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1")
              implementation("com.google.mlkit:text-recognition:16.0.1")
              implementation("com.google.mlkit:barcode-scanning:17.3.0")

              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")

              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
          }
          EOF

      - name: 4. Security Gate - Verify Zero Internet Permission
        run: |
          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "❌ SECURITY VIOLATION: INTERNET permission found!"
            exit 1
          fi

      - name: 5. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 6. Ensure Persistent Debug Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 7. Accept Pre-Installed Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: 8. Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 9. Compile Debug APK
        run: gradle assembleDebug --no-daemon --console=plain

      - name: 10. Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyVault-Sprint3.1-PrecisionOCR
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
