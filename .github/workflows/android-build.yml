name: Sprint 3.4 - ICU Regex Fix & Permanent Keystore Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Organize Package Paths & Verify Source Files
        run: |
          python3 - << 'EOF'
          import os

          target_files = {
              "MainActivity.kt": "app/src/main/java/com/familyvault/app/MainActivity.kt",
              "VaultCryptoManager.kt": "app/src/main/java/com/familyvault/app/crypto/VaultCryptoManager.kt",
              "Entities.kt": "app/src/main/java/com/familyvault/app/data/local/Entities.kt",
              "VaultDao.kt": "app/src/main/java/com/familyvault/app/data/local/VaultDao.kt",
              "VaultDatabase.kt": "app/src/main/java/com/familyvault/app/data/local/VaultDatabase.kt",
              "NameResolutionEngine.kt": "app/src/main/java/com/familyvault/app/domain/NameResolutionEngine.kt",
              "DocumentParserEngine.kt": "app/src/main/java/com/familyvault/app/domain/DocumentParserEngine.kt",
              "ScanAndVoiceProcessor.kt": "app/src/main/java/com/familyvault/app/scanner/ScanAndVoiceProcessor.kt"
          }

          rescued = {}
          for root, dirs, files in os.walk("."):
              if ".git" in root.split(os.sep):
                  continue
              for f in files:
                  clean_f = f.strip()
                  if clean_f in target_files:
                      full_path = os.path.join(root, f)
                      with open(full_path, "rb") as fp:
                          data = fp.read()
                      if len(data) > 50:
                          rescued[clean_f] = data

          os.makedirs("app/src/main/java/com/familyvault/app/crypto", exist_ok=True)
          os.makedirs("app/src/main/java/com/familyvault/app/data/local", exist_ok=True)
          os.makedirs("app/src/main/java/com/familyvault/app/domain", exist_ok=True)
          os.makedirs("app/src/main/java/com/familyvault/app/scanner", exist_ok=True)

          for fname, dest in target_files.items():
              if fname in rescued:
                  with open(dest, "wb") as out:
                      out.write(rescued[fname])
                  print(f"Verified -> {dest}")
              else:
                  print(f"Missing required file in repo: {fname}")
                  exit(1)
          EOF

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Create & Commit Permanent Repo Keystore (Fixes Update Conflicts Forever)
        run: |
          if [ ! -f "app/familyvault-signing.jks" ]; then
            keytool -genkeypair -v \
              -keystore app/familyvault-signing.jks \
              -storetype PKCS12 \
              -storepass familyvault123 \
              -alias familyvaultkey \
              -keypass familyvault123 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=FamilyVault,O=Industrial,C=IN"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/familyvault-signing.jks
            git commit -m "chore: lock permanent APK signing keystore [skip ci]"
            git push || true
          fi

      - name: 5. Enforce Gradle Configuration with Explicit Keystore Binding
        run: |
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }
          android {
              namespace = "com.familyvault.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.familyvault.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 20
                  versionName = "0.3.4-icu-fixed"
              }
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("familyvault-signing.jks")
                      storePassword = "familyvault123"
                      keyAlias = "familyvaultkey"
                      keyPassword = "familyvault123"
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              packaging {
                  resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" }
                  jniLibs { useLegacyPackaging = true }
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.fragment:fragment-ktx:1.8.2")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.4")
              implementation("androidx.biometric:biometric:1.1.0")
              val roomVersion = "2.6.1"
              implementation("androidx.room:room-runtime:$roomVersion")
              implementation("androidx.room:room-ktx:$roomVersion")
              ksp("androidx.room:room-compiler:$roomVersion")
              implementation("net.zetetic:sqlcipher-android:4.6.1@aar")
              implementation("androidx.sqlite:sqlite-ktx:2.4.0")
              implementation("com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1")
              implementation("com.google.mlkit:text-recognition:16.0.1")
              implementation("com.google.mlkit:barcode-scanning:17.3.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
          }
          EOF

      - name: 6. Accept Android SDK Licenses & Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 7. Compile Debug APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          gradle assembleDebug --no-daemon --console=plain

      - name: 8. Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyVault-Sprint3.4-Fixed
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error