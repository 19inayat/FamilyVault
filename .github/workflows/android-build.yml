name: Sprint 3 - FamilyVault Scanner, QR & Voice Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Cache Persistent Debug Keystore (Prevents Uninstall on Update)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: familyvault-persistent-debug-keystore-v1

      - name: 3. Purge Old Spaced Folders & Generate Complete Sprint 3 Source Tree
        run: |
          # Remove any legacy or spaced 'app' directories in the workspace
          python3 - << 'PYEOF'
          import os, shutil
          for item in os.listdir("."):
              if item.strip().startswith("app") and os.path.isdir(item):
                  shutil.rmtree(item)
              elif item != item.strip():
                  if os.path.isdir(item):
                      shutil.rmtree(item)
                  else:
                      os.remove(item)
          PYEOF

          mkdir -p app/src/main/java/com/familyvault/app/crypto
          mkdir -p app/src/main/java/com/familyvault/app/data/local
          mkdir -p app/src/main/java/com/familyvault/app/domain
          mkdir -p app/src/main/java/com/familyvault/app/scanner

          # 1. AndroidManifest.xml (Zero Internet Permission)
          sed 's/^          //' << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/ic_lock_lock"
                  android:label="FamilyVault"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 2. VaultCryptoManager.kt (Android 13 Hardware Keystore AES-256-GCM)
          sed 's/^          //' << 'EOF' > app/src/main/java/com/familyvault/app/crypto/VaultCryptoManager.kt
          package com.familyvault.app.crypto

          import android.content.Context
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import android.util.Base64
          import java.io.ByteArrayInputStream
          import java.io.File
          import java.io.InputStream
          import java.security.KeyStore
          import java.security.MessageDigest
          import java.security.SecureRandom
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec

          class VaultCryptoManager(context: Context) {

              private val appContext = context.applicationContext
              private val prefs = appContext.getSharedPreferences(PREFS_FILE, Context.MODE_PRIVATE)

              private fun getOrCreateHardwareSecretKey(): SecretKey {
                  val keyStore = KeyStore.getInstance(ANDROID_KEYSTORE).apply { load(null) }
                  val existingEntry = keyStore.getEntry(KEY_ALIAS, null) as? KeyStore.SecretKeyEntry
                  if (existingEntry != null) return existingEntry.secretKey

                  val keyGenerator = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, ANDROID_KEYSTORE)
                  val spec = KeyGenParameterSpec.Builder(
                      KEY_ALIAS,
                      KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT
                  )
                      .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                      .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                      .setKeySize(256)
                      .setRandomizedEncryptionRequired(true)
                      .build()

                  keyGenerator.init(spec)
                  return keyGenerator.generateKey()
              }

              private fun encryptWithHardwareKey(plainBytes: ByteArray, associatedData: ByteArray): ByteArray {
                  val cipher = Cipher.getInstance(AES_GCM_TRANSFORMATION)
                  cipher.init(Cipher.ENCRYPT_MODE, getOrCreateHardwareSecretKey())
                  cipher.updateAAD(associatedData)
                  val iv = cipher.iv
                  val cipherBytes = cipher.doFinal(plainBytes)

                  val combined = ByteArray(1 + iv.size + cipherBytes.size)
                  combined[0] = iv.size.toByte()
                  System.arraycopy(iv, 0, combined, 1, iv.size)
                  System.arraycopy(cipherBytes, 0, combined, 1 + iv.size, cipherBytes.size)
                  return combined
              }

              private fun decryptWithHardwareKey(combined: ByteArray, associatedData: ByteArray): ByteArray {
                  val ivSize = combined[0].toInt() and 0xFF
                  val iv = combined.copyOfRange(1, 1 + ivSize)
                  val cipherBytes = combined.copyOfRange(1 + ivSize, combined.size)

                  val cipher = Cipher.getInstance(AES_GCM_TRANSFORMATION)
                  val spec = GCMParameterSpec(GCM_TAG_BITS, iv)
                  cipher.init(Cipher.DECRYPT_MODE, getOrCreateHardwareSecretKey(), spec)
                  cipher.updateAAD(associatedData)
                  return cipher.doFinal(cipherBytes)
              }

              fun getOrCreateDatabasePassphrase(): ByteArray {
                  val existingB64 = prefs.getString(ENCRYPTED_DB_PASS_KEY, null)
                  if (existingB64 != null) {
                      try {
                          val combined = Base64.decode(existingB64, Base64.NO_WRAP)
                          return decryptWithHardwareKey(combined, DB_AAD)
                      } catch (_: Throwable) {
                          prefs.edit().remove(ENCRYPTED_DB_PASS_KEY).commit()
                      }
                  }

                  val newPassphrase = ByteArray(32).also { SecureRandom().nextBytes(it) }
                  val encrypted = encryptWithHardwareKey(newPassphrase, DB_AAD)
                  prefs.edit()
                      .putString(ENCRYPTED_DB_PASS_KEY, Base64.encodeToString(encrypted, Base64.NO_WRAP))
                      .commit()
                  return newPassphrase
              }

              fun encryptStreamToVaultFile(
                  inputStream: InputStream,
                  destinationFile: File,
                  associatedData: String
              ): String {
                  val rawBytes = inputStream.readBytes()
                  val digest = MessageDigest.getInstance("SHA-256").digest(rawBytes)
                  val encryptedBytes = encryptWithHardwareKey(rawBytes, associatedData.toByteArray())
                  destinationFile.writeBytes(encryptedBytes)
                  return digest.joinToString("") { "%02x".format(it) }
              }

              fun openDecryptedStream(encryptedFile: File, associatedData: String): InputStream {
                  val encryptedBytes = encryptedFile.readBytes()
                  val decryptedBytes = decryptWithHardwareKey(encryptedBytes, associatedData.toByteArray())
                  return ByteArrayInputStream(decryptedBytes)
              }

              companion object {
                  private const val ANDROID_KEYSTORE = "AndroidKeyStore"
                  private const val KEY_ALIAS = "family_vault_hw_aes256_v2"
                  private const val AES_GCM_TRANSFORMATION = "AES/GCM/NoPadding"
                  private const val GCM_TAG_BITS = 128
                  private const val PREFS_FILE = "family_vault_secure_prefs"
                  private const val ENCRYPTED_DB_PASS_KEY = "wrapped_sqlcipher_pass_v2"
                  private val DB_AAD = "SQLCipher_FamilyVault_v2".toByteArray()
              }
          }
          EOF

          # 3. Entities.kt
          sed 's/^          //' << 'EOF' > app/src/main/java/com/familyvault/app/data/local/Entities.kt
          package com.familyvault.app.data.local

          import androidx.room.ColumnInfo
          import androidx.room.Entity
          import androidx.room.ForeignKey
          import androidx.room.Index
          import androidx.room.PrimaryKey

          @Entity(
              tableName = "family_members",
              indices = [
                  Index(value = ["canonical_name"], unique = true),
                  Index(value = ["sorted_tokens"])
              ]
          )
          data class FamilyMemberEntity(
              @PrimaryKey(autoGenerate = true)
              @ColumnInfo(name = "member_id") val memberId: Long = 0,
              @ColumnInfo(name = "canonical_name") val canonicalName: String,
              @ColumnInfo(name = "sorted_tokens") val sortedTokens: String,
              @ColumnInfo(name = "phonetic_primary") val phoneticPrimary: String,
              @ColumnInfo(name = "phonetic_secondary") val phoneticSecondary: String? = null,
              @ColumnInfo(name = "relationship_role") val relationshipRole: String,
              @ColumnInfo(name = "blood_group") val bloodGroup: String? = null,
              @ColumnInfo(name = "legacy_folder_uri") val legacyFolderUri: String? = null,
              @ColumnInfo(name = "created_at") val createdAt: Long = System.currentTimeMillis()
          )

          @Entity(
              tableName = "member_aliases",
              foreignKeys = [
                  ForeignKey(
                      entity = FamilyMemberEntity::class,
                      parentColumns = ["member_id"],
                      childColumns = ["member_id"],
                      onDelete = ForeignKey.CASCADE
                  )
              ],
              indices = [
                  Index(value = ["member_id"]),
                  Index(value = ["alias_normalized"], unique = true)
              ]
          )
          data class MemberAliasEntity(
              @PrimaryKey(autoGenerate = true)
              @ColumnInfo(name = "alias_id") val aliasId: Long = 0,
              @ColumnInfo(name = "member_id") val memberId: Long,
              @ColumnInfo(name = "alias_normalized") val aliasNormalized: String
          )

          @Entity(
              tableName = "documents",
              foreignKeys = [
                  ForeignKey(
                      entity = FamilyMemberEntity::class,
                      parentColumns = ["member_id"],
                      childColumns = ["member_id"],
                      onDelete = ForeignKey.CASCADE
                  )
              ],
              indices = [
                  Index(value = ["member_id"]),
                  Index(value = ["doc_category", "doc_sub_type"]),
                  Index(value = ["expiry_date"])
              ]
          )
          data class DocumentEntity(
              @PrimaryKey(autoGenerate = true)
              @ColumnInfo(name = "doc_id") val docId: Long = 0,
              @ColumnInfo(name = "member_id") val memberId: Long,
              @ColumnInfo(name = "doc_category") val docCategory: String,
              @ColumnInfo(name = "doc_sub_type") val docSubType: String,
              @ColumnInfo(name = "name_on_document") val nameOnDocument: String,
              @ColumnInfo(name = "document_number") val documentNumber: String,
              @ColumnInfo(name = "issuing_authority") val issuingAuthority: String,
              @ColumnInfo(name = "issue_date") val issueDate: String? = null,
              @ColumnInfo(name = "expiry_date") val expiryDate: String? = null,
              @ColumnInfo(name = "linked_mobile") val linkedMobile: String? = null,
              @ColumnInfo(name = "extra_attributes_json") val extraAttributesJson: String = "{}",
              @ColumnInfo(name = "raw_extracted_text") val rawExtractedText: String,
              @ColumnInfo(name = "extraction_source") val extractionSource: String,
              @ColumnInfo(name = "version_number") val versionNumber: Int = 1,
              @ColumnInfo(name = "updated_at") val updatedAt: Long = System.currentTimeMillis()
          )

          @Entity(
              tableName = "document_attachments",
              foreignKeys = [
                  ForeignKey(
                      entity = DocumentEntity::class,
                      parentColumns = ["doc_id"],
                      childColumns = ["doc_id"],
                      onDelete = ForeignKey.CASCADE
                  )
              ],
              indices = [
                  Index(value = ["doc_id"]),
                  Index(value = ["sha256_hash"], unique = true)
              ]
          )
          data class DocumentAttachmentEntity(
              @PrimaryKey(autoGenerate = true)
              @ColumnInfo(name = "attachment_id") val attachmentId: Long = 0,
              @ColumnInfo(name = "doc_id") val docId: Long,
              @ColumnInfo(name = "page_order") val pageOrder: Int,
              @ColumnInfo(name = "file_role") val fileRole: String,
              @ColumnInfo(name = "tink_encrypted_path") val tinkEncryptedPath: String,
              @ColumnInfo(name = "sha256_hash") val sha256Hash: String
          )

          @Entity(
              tableName = "document_history",
              foreignKeys = [
                  ForeignKey(
                      entity = DocumentEntity::class,
                      parentColumns = ["doc_id"],
                      childColumns = ["doc_id"],
                      onDelete = ForeignKey.CASCADE
                  )
              ],
              indices = [Index(value = ["doc_id"])]
          )
          data class DocumentHistoryEntity(
              @PrimaryKey(autoGenerate = true)
              @ColumnInfo(name = "history_id") val historyId: Long = 0,
              @ColumnInfo(name = "doc_id") val docId: Long,
              @ColumnInfo(name = "version_number") val versionNumber: Int,
              @ColumnInfo(name = "old_document_number") val oldDocumentNumber: String,
              @ColumnInfo(name = "old_issue_date") val oldIssueDate: String? = null,
              @ColumnInfo(name = "old_expiry_date") val oldExpiryDate: String? = null,
              @ColumnInfo(name = "old_encrypted_path") val oldEncryptedPath: String,
              @ColumnInfo(name = "archived_at") val archivedAt: Long = System.currentTimeMillis()
          )
          EOF

          # 4. VaultDao.kt
          sed 's/^          //' << 'EOF' > app/src/main/java/com/familyvault/app/data/local/VaultDao.kt
          package com.familyvault.app.data.local

          import androidx.room.Dao
          import androidx.room.Insert
          import androidx.room.OnConflictStrategy
          import androidx.room.Query
          import androidx.room.RawQuery
          import androidx.room.Update
          import androidx.sqlite.db.SimpleSQLiteQuery
          import androidx.sqlite.db.SupportSQLiteQuery
          import kotlinx.coroutines.flow.Flow

          @Dao
          interface VaultDao {
              @Insert(onConflict = OnConflictStrategy.ABORT)
              suspend fun insertFamilyMember(member: FamilyMemberEntity): Long

              @Insert(onConflict = OnConflictStrategy.IGNORE)
              suspend fun insertAlias(alias: MemberAliasEntity): Long

              @Query("SELECT * FROM family_members ORDER BY canonical_name ASC")
              fun observeAllFamilyMembers(): Flow<List<FamilyMemberEntity>>

              @Query("SELECT * FROM family_members")
              suspend fun getAllFamilyMembersOnce(): List<FamilyMemberEntity>

              @Query("SELECT member_id FROM member_aliases WHERE alias_normalized = :normalizedAlias LIMIT 1")
              suspend fun findMemberIdByAlias(normalizedAlias: String): Long?

              @Query("SELECT * FROM documents ORDER BY updated_at DESC")
              fun observeAllDocuments(): Flow<List<DocumentEntity>>

              @Query("SELECT * FROM documents WHERE member_id = :memberId AND doc_sub_type = :subType LIMIT 1")
              suspend fun findExistingDocumentBySubType(memberId: Long, subType: String): DocumentEntity?

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertDocument(document: DocumentEntity): Long

              @Update
              suspend fun updateDocument(document: DocumentEntity)

              @Insert(onConflict = OnConflictStrategy.IGNORE)
              suspend fun insertAttachment(attachment: DocumentAttachmentEntity): Long

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertDocumentHistory(history: DocumentHistoryEntity): Long

              @Query("SELECT * FROM documents WHERE member_id = :memberId ORDER BY doc_category, doc_sub_type")
              fun observeDocumentsForMember(memberId: Long): Flow<List<DocumentEntity>>

              @Query("DELETE FROM family_members WHERE canonical_name = 'Self Profile (Test)'")
              suspend fun cleanupSprint1TestProfile()

              @RawQuery(observedEntities = [DocumentEntity::class])
              suspend fun executeRawDocumentSearch(query: SupportSQLiteQuery): List<DocumentEntity>
          }

          suspend fun VaultDao.upsertDocumentWithVersionAudit(incoming: DocumentEntity): Pair<Long, String> {
              val existing = findExistingDocumentBySubType(incoming.memberId, incoming.docSubType)
              if (existing == null) {
                  val id = insertDocument(incoming)
                  return Pair(id, "Inserted v1 (${incoming.docSubType})")
              }
              return if (existing.documentNumber.equals(incoming.documentNumber, ignoreCase = true)) {
                  val updated = incoming.copy(
                      docId = existing.docId,
                      versionNumber = existing.versionNumber,
                      updatedAt = System.currentTimeMillis()
                  )
                  updateDocument(updated)
                  Pair(existing.docId, "Updated existing ${incoming.docSubType}")
              } else {
                  insertDocumentHistory(
                      DocumentHistoryEntity(
                          docId = existing.docId,
                          versionNumber = existing.versionNumber,
                          oldDocumentNumber = existing.documentNumber,
                          oldIssueDate = existing.issueDate,
                          oldExpiryDate = existing.expiryDate,
                          oldEncryptedPath = "vault_archive_v${existing.versionNumber}"
                      )
                  )
                  val newVersion = existing.versionNumber + 1
                  updateDocument(incoming.copy(docId = existing.docId, versionNumber = newVersion, updatedAt = System.currentTimeMillis()))
                  Pair(existing.docId, "Archived v${existing.versionNumber} & Upgraded to v$newVersion")
              }
          }

          suspend fun VaultDao.searchDocumentsFts5(searchTerm: String): List<DocumentEntity> {
              val sanitized = searchTerm.replace("\"", "\"\"").trim()
              if (sanitized.isEmpty()) return emptyList()
              return try {
                  val sql = "SELECT d.* FROM documents d INNER JOIN documents_fts fts ON d.doc_id = fts.rowid WHERE documents_fts MATCH '\"$sanitized\"' ORDER BY d.updated_at DESC"
                  executeRawDocumentSearch(SimpleSQLiteQuery(sql))
              } catch (_: Throwable) {
                  val fallbackSql = "SELECT * FROM documents WHERE raw_extracted_text LIKE '%$sanitized%' OR document_number LIKE '%$sanitized%' ORDER BY updated_at DESC"
                  executeRawDocumentSearch(SimpleSQLiteQuery(fallbackSql))
              }
          }
          EOF

          # 5. VaultDatabase.kt
          sed 's/^          //' << 'EOF' > app/src/main/java/com/familyvault/app/data/local/VaultDatabase.kt
          package com.familyvault.app.data.local

          import android.content.Context
          import androidx.room.Database
          import androidx.room.Room
          import androidx.room.RoomDatabase
          import androidx.sqlite.db.SupportSQLiteDatabase
          import net.zetetic.database.sqlcipher.SupportOpenHelperFactory

          @Database(
              entities = [
                  FamilyMemberEntity::class,
                  MemberAliasEntity::class,
                  DocumentEntity::class,
                  DocumentAttachmentEntity::class,
                  DocumentHistoryEntity::class
              ],
              version = 1,
              exportSchema = false
          )
          abstract class VaultDatabase : RoomDatabase() {

              abstract fun vaultDao(): VaultDao

              companion object {
                  private const val DB_NAME = "family_vault_v2_encrypted.db"

                  @Volatile
                  private var INSTANCE: VaultDatabase? = null

                  fun getUnlockedInstance(context: Context, passphraseBytes: ByteArray): VaultDatabase {
                      return INSTANCE ?: synchronized(this) {
                          INSTANCE ?: buildEncryptedDatabase(context.applicationContext, passphraseBytes).also {
                              INSTANCE = it
                          }
                      }
                  }

                  private fun buildEncryptedDatabase(
                      appContext: Context,
                      passphraseBytes: ByteArray
                  ): VaultDatabase {
                      System.loadLibrary("sqlcipher")
                      return try {
                          openDatabaseInternal(appContext, passphraseBytes)
                      } catch (_: Throwable) {
                          appContext.deleteDatabase(DB_NAME)
                          openDatabaseInternal(appContext, passphraseBytes)
                      }
                  }

                  private fun openDatabaseInternal(
                      appContext: Context,
                      passphraseBytes: ByteArray
                  ): VaultDatabase {
                      val keyCopy = passphraseBytes.copyOf()
                      val factory = SupportOpenHelperFactory(keyCopy)
                      return Room.databaseBuilder(appContext, VaultDatabase::class.java, DB_NAME)
                          .openHelperFactory(factory)
                          .addCallback(Fts5BootstrapCallback())
                          .fallbackToDestructiveMigrationOnDowngrade()
                          .build()
                          .also { db -> db.openHelper.writableDatabase }
                  }

                  fun lockAndCloseDatabase() {
                      synchronized(this) {
                          INSTANCE?.close()
                          INSTANCE = null
                      }
                  }
              }

              private class Fts5BootstrapCallback : Callback() {
                  override fun onCreate(db: SupportSQLiteDatabase) {
                      super.onCreate(db)
                      try {
                          db.execSQL(
                              "CREATE VIRTUAL TABLE IF NOT EXISTS documents_fts USING fts5(name_on_document, document_number, issuing_authority, extra_attributes_json, raw_extracted_text, content='documents', content_rowid='doc_id', tokenize='trigram');"
                          )
                      } catch (_: Throwable) {
                          db.execSQL(
                              "CREATE VIRTUAL TABLE IF NOT EXISTS documents_fts USING fts5(name_on_document, document_number, issuing_authority, extra_attributes_json, raw_extracted_text, content='documents', content_rowid='doc_id');"
                          )
                      }
                      db.execSQL(
                          "CREATE TRIGGER IF NOT EXISTS documents_ai AFTER INSERT ON documents BEGIN INSERT INTO documents_fts(rowid, name_on_document, document_number, issuing_authority, extra_attributes_json, raw_extracted_text) VALUES (new.doc_id, new.name_on_document, new.document_number, new.issuing_authority, new.extra_attributes_json, new.raw_extracted_text); END;"
                      )
                      db.execSQL(
                          "CREATE TRIGGER IF NOT EXISTS documents_ad AFTER DELETE ON documents BEGIN INSERT INTO documents_fts(documents_fts, rowid, name_on_document, document_number, issuing_authority, extra_attributes_json, raw_extracted_text) VALUES ('delete', old.doc_id, old.name_on_document, old.document_number, old.issuing_authority, old.extra_attributes_json, old.raw_extracted_text); END;"
                      )
                      db.execSQL(
                          "CREATE TRIGGER IF NOT EXISTS documents_au AFTER UPDATE ON documents BEGIN INSERT INTO documents_fts(documents_fts, rowid, name_on_document, document_number, issuing_authority, extra_attributes_json, raw_extracted_text) VALUES ('delete', old.doc_id, old.name_on_document, old.document_number, old.issuing_authority, old.extra_attributes_json, old.raw_extracted_text); INSERT INTO documents_fts(rowid, name_on_document, document_number, issuing_authority, extra_attributes_json, raw_extracted_text) VALUES (new.doc_id, new.name_on_document, new.document_number, new.issuing_authority, new.extra_attributes_json, new.raw_extracted_text); END;"
                      )
                  }
              }
          }
          EOF

          # 6. NameResolutionEngine.kt
          sed 's/^          //' << 'EOF' > app/src/main/java/com/familyvault/app/domain/NameResolutionEngine.kt
          package com.familyvault.app.domain

          import com.familyvault.app.data.local.FamilyMemberEntity
          import kotlin.math.max
          import kotlin.math.min

          sealed class NameResolutionResult {
              data class ExactOrAliasMatch(
                  val member: FamilyMemberEntity,
                  val matchedVia: String
              ) : NameResolutionResult()

              data class MinimalMismatchAlert(
                  val candidateMember: FamilyMemberEntity,
                  val extractedRawName: String,
                  val normalizedAliasToSave: String,
                  val similarityScore: Double,
                  val editDistance: Int,
                  val matchReason: String
              ) : NameResolutionResult()

              data class NewMemberDetected(
                  val cleanedDisplayName: String,
                  val sortedTokens: String,
                  val phoneticCode: String
              ) : NameResolutionResult()
          }

          object NameResolutionEngine {

              private val HONORIFICS = setOf(
                  "MR", "MRS", "MS", "MISS", "SRI", "SMT", "SHREE", "SHRI",
                  "KUMARI", "KUM", "DR", "PROF", "LATE", "MASTER"
              )

              private val TOKEN_SYNONYMS = mapOf(
                  "MOHD" to "MOHAMMED",
                  "MD" to "MOHAMMED",
                  "MAHAMMAD" to "MOHAMMED",
                  "MUHAMMAD" to "MOHAMMED",
                  "ABD" to "ABDUL"
              )

              fun normalizeToSortedTokens(rawName: String): String {
                  return extractCleanTokens(rawName).sorted().joinToString(" ")
              }

              fun formatCanonicalDisplayName(rawName: String): String {
                  val tokens = rawName
                      .replace(Regex("[^A-Za-z.\\s]"), " ")
                      .trim()
                      .split(Regex("\\s+"))
                      .filter { it.isNotBlank() && it.uppercase().removeSuffix(".") !in HONORIFICS }

                  return tokens.joinToString(" ") { token ->
                      token.lowercase().replaceFirstChar { it.uppercase() }
                  }
              }

              private fun extractCleanTokens(rawName: String): List<String> {
                  return rawName
                      .uppercase()
                      .replace(Regex("[^A-Z\\s]"), " ")
                      .split(Regex("\\s+"))
                      .map { it.trim() }
                      .filter { it.isNotEmpty() && it !in HONORIFICS }
                      .map { TOKEN_SYNONYMS[it] ?: it }
              }

              fun computePhoneticSignature(rawName: String): String {
                  val joined = extractCleanTokens(rawName).sorted().joinToString("")
                  if (joined.isEmpty()) return "UNK"
                  val firstChar = joined.first()
                  val normalized = joined
                      .replace("PH", "F")
                      .replace("BH", "B")
                      .replace("DH", "D")
                      .replace("TH", "T")
                      .replace("KH", "K")
                      .replace("GH", "G")
                      .replace("SH", "S")
                      .replace("Z", "S")
                      .replace("V", "W")
                      .replace("Y", "I")
                      .replace(Regex("[AEIOUHW]"), "")
                      .replace(Regex("(.)\\1+"), "$1")
                  return (firstChar + normalized.drop(1)).take(8)
              }

              fun resolveIdentity(
                  extractedRawName: String,
                  existingMembers: List<FamilyMemberEntity>,
                  aliasMemberIdIfFound: Long?
              ): NameResolutionResult {
                  val cleanedDisplay = formatCanonicalDisplayName(extractedRawName).ifEmpty { "Unknown Name" }
                  val inputSortedTokens = normalizeToSortedTokens(extractedRawName)
                  val inputPhonetic = computePhoneticSignature(extractedRawName)

                  if (aliasMemberIdIfFound != null) {
                      val matchedMember = existingMembers.find { it.memberId == aliasMemberIdIfFound }
                      if (matchedMember != null) {
                          return NameResolutionResult.ExactOrAliasMatch(
                              member = matchedMember,
                              matchedVia = "Saved Alias ('$cleanedDisplay')"
                          )
                      }
                  }

                  for (member in existingMembers) {
                      if (member.sortedTokens.equals(inputSortedTokens, ignoreCase = true)) {
                          return NameResolutionResult.ExactOrAliasMatch(
                              member = member,
                              matchedVia = "Exact Canonical Match"
                          )
                      }
                  }

                  val inputTokenList = extractCleanTokens(extractedRawName)
                  var bestCandidate: FamilyMemberEntity? = null
                  var bestJaroWinkler = 0.0
                  var bestEditDistance = Int.MAX_VALUE
                  var bestReason = ""

                  for (member in existingMembers) {
                      val targetTokens = member.sortedTokens
                      val ocrInput = normalizeOcrConfusables(inputSortedTokens)
                      val ocrTarget = normalizeOcrConfusables(targetTokens)

                      val jwScore = max(
                          jaroWinklerSimilarity(inputSortedTokens, targetTokens),
                          jaroWinklerSimilarity(ocrInput, ocrTarget)
                      )
                      val editDist = min(
                          levenshteinDistance(inputSortedTokens, targetTokens),
                          levenshteinDistance(ocrInput, ocrTarget)
                      )
                      val isInitialMatch = checkIndianInitialExpansion(
                          inputTokenList,
                          extractCleanTokens(member.canonicalName)
                      )
                      val isPhoneticMatch = member.phoneticPrimary == inputPhonetic && jwScore >= 0.78

                      if (isInitialMatch || (editDist <= 2 && targetTokens.length >= 5) || jwScore >= 0.84 || isPhoneticMatch) {
                          val effectiveScore = when {
                              isInitialMatch -> max(jwScore, 0.92)
                              isPhoneticMatch -> max(jwScore, 0.88)
                              else -> jwScore
                          }
                          if (effectiveScore > bestJaroWinkler) {
                              bestJaroWinkler = effectiveScore
                              bestEditDistance = editDist
                              bestCandidate = member
                              bestReason = when {
                                  isInitialMatch -> "Initial expansion match ('$cleanedDisplay' <-> '${member.canonicalName}')"
                                  editDist <= 2 -> "Spelling typo detected (Edit distance: $editDist char)"
                                  isPhoneticMatch -> "Phonetic sound-alike match"
                                  else -> "Fuzzy similarity (${(effectiveScore * 100).toInt()}%)"
                              }
                          }
                      }
                  }

                  if (bestCandidate != null) {
                      return NameResolutionResult.MinimalMismatchAlert(
                          candidateMember = bestCandidate,
                          extractedRawName = cleanedDisplay,
                          normalizedAliasToSave = inputSortedTokens,
                          similarityScore = bestJaroWinkler,
                          editDistance = bestEditDistance,
                          matchReason = bestReason
                      )
                  }

                  return NameResolutionResult.NewMemberDetected(
                      cleanedDisplayName = cleanedDisplay,
                      sortedTokens = inputSortedTokens,
                      phoneticCode = inputPhonetic
                  )
              }

              private fun checkIndianInitialExpansion(tokensA: List<String>, tokensB: List<String>): Boolean {
                  if (tokensA.size < 2 || tokensB.size < 2 || tokensA.size != tokensB.size) return false
                  val fullWordsA = tokensA.filter { it.length > 1 }
                  val initialsA = tokensA.filter { it.length == 1 }
                  if (initialsA.isNotEmpty() && fullWordsA.isNotEmpty()) {
                      val remainingB = tokensB.toMutableList()
                      for (wordA in fullWordsA) {
                          val matchIdx = remainingB.indexOfFirst {
                              levenshteinDistance(wordA, it) <= 1 || jaroWinklerSimilarity(wordA, it) >= 0.88
                          }
                          if (matchIdx == -1) return false
                          remainingB.removeAt(matchIdx)
                      }
                      for (initA in initialsA) {
                          val initIdx = remainingB.indexOfFirst { it.startsWith(initA) }
                          if (initIdx == -1) return false
                          remainingB.removeAt(initIdx)
                      }
                      return remainingB.isEmpty()
                  }
                  return false
              }

              private fun normalizeOcrConfusables(input: String): String {
                  return input.replace('0', 'O').replace('1', 'I').replace('L', 'I').replace('5', 'S').replace('8', 'B')
              }

              fun levenshteinDistance(s1: String, s2: String): Int {
                  if (s1 == s2) return 0
                  if (s1.isEmpty()) return s2.length
                  if (s2.isEmpty()) return s1.length
                  var prev = IntArray(s2.length + 1) { it }
                  var curr = IntArray(s2.length + 1)
                  for (i in 1..s1.length) {
                      curr[0] = i
                      for (j in 1..s2.length) {
                          val cost = if (s1[i - 1] == s2[j - 1]) 0 else 1
                          curr[j] = minOf(curr[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost)
                      }
                      val temp = prev; prev = curr; curr = temp
                  }
                  return prev[s2.length]
              }

              fun jaroWinklerSimilarity(s1: String, s2: String): Double {
                  if (s1 == s2) return 1.0
                  if (s1.isEmpty() || s2.isEmpty()) return 0.0
                  val matchDistance = max(s1.length, s2.length) / 2 - 1
                  val s1Matches = BooleanArray(s1.length)
                  val s2Matches = BooleanArray(s2.length)
                  var matches = 0
                  for (i in s1.indices) {
                      val start = max(0, i - matchDistance)
                      val end = min(i + matchDistance + 1, s2.length)
                      for (j in start until end) {
                          if (s2Matches[j] || s1[i] != s2[j]) continue
                          s1Matches[i] = true; s2Matches[j] = true; matches++; break
                      }
                  }
                  if (matches == 0) return 0.0
                  var t = 0; var k = 0
                  for (i in s1.indices) {
                      if (!s1Matches[i]) continue
                      while (!s2Matches[k]) k++
                      if (s1[i] != s2[k]) t++
                      k++
                  }
                  val m = matches.toDouble()
                  val jaro = ((m / s1.length) + (m / s2.length) + ((m - t / 2.0) / m)) / 3.0
                  var prefix = 0
                  for (i in 0 until minOf(4, s1.length, s2.length)) {
                      if (s1[i] == s2[i]) prefix++ else break
                  }
                  return jaro + (prefix * 0.1 * (1.0 - jaro))
              }
          }
