name: Sprint 1 - FamilyVault Industrial Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Ensure Android Manifest Exists & Zero-Net Protected
        run: |
          mkdir -p app/src/main
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "⚠️ AndroidManifest.xml not found in repo. Auto-generating zero-net manifest..."
            cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <application
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:dataExtractionRules="@null"
                  android:icon="@android:drawable/ic_lock_lock"
                  android:label="FamilyVault"
                  android:supportsRtl="true"
                  android:extractNativeLibs="false"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "❌ SECURITY VIOLATION: INTERNET permission found in AndroidManifest.xml!"
            exit 1
          else
            echo "✅ Zero-Network Manifest Verified."
          fi

      - name: 3. Enforce Robust Root Gradle Files (AGP 8.5.0)
        run: |
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FamilyVault"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("com.google.devtools.ksp") version "2.0.21-1.0.27" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF
          echo "✅ Root Gradle configuration successfully enforced."

      - name: 4. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Accept Pre-Installed Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          echo "✅ Android SDK Licenses Accepted"

      - name: 6. Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 7. Compile Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 8. Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyVault-Sprint1-v0.1-alpha
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
