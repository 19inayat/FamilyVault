        run: |
          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "❌ SECURITY VIOLATION: INTERNET permission found!"
            exit 1
          fi

      - name: 6. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 7. Ensure Persistent Debug Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 8. Accept Pre-Installed Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: 9. Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 10. Compile Debug APK
        run: gradle assembleDebug --no-daemon --console=plain

      - name: 11. Audit APK Bytecode
        run: |
          for cls in "MainActivity.class" "NameResolutionEngine.class" "DocumentParserEngine.class" "ScanAndVoiceProcessor.class"; do
            if ! find app/build -name "$cls" | grep -q "$cls"; then
              echo "❌ FATAL: $cls was NOT compiled!"
              exit 1
            fi
          done
          echo "✅ Sprint 3 Bytecode Audit Passed!"

      - name: 12. Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyVault-Sprint3-v0.3.0-ScannerAndVoice
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error